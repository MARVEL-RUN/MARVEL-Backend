name: MarvelRun User Backend Test Deploy

on:
  pull_request:
    branches:
      - develop
    paths:
      - "user/**"
      - "common-entity/**"
      - ".dockerignore"
      - ".github/workflows/test-deploy.yml"
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: marvelrun-backend-test
  cancel-in-progress: false

env:
  AWS_REGION: ap-northeast-2
  ECR_REPOSITORY: marvelrun/backend
  EC2_INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}

jobs:
  build-push-deploy:
    # fork PR의 AWS Test 배포는 허용하지 않는다.
    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event.pull_request.head.repo.full_name == github.repository

    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate deployment configuration
        shell: bash
        run: |
          set -euo pipefail

          if [ -z "${EC2_INSTANCE_ID:-}" ]; then
            echo "::error::EC2_INSTANCE_ID GitHub Variable이 없습니다."
            exit 1
          fi

          if [[ ! "$EC2_INSTANCE_ID" =~ ^i-[a-f0-9]+$ ]]; then
            echo "::error::잘못된 EC2 Instance ID 형식"
            exit 1
          fi

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          allowed-account-ids: 705186435017

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push User Docker image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail

          if aws ecr describe-images \
              --repository-name "$ECR_REPOSITORY" \
              --image-ids imageTag="$IMAGE_TAG" \
              --region "$AWS_REGION" \
              > /dev/null 2>&1; then

            echo "Immutable SHA tag $IMAGE_TAG already exists."
            echo "Reusing the existing artifact without rebuilding."
          else
            docker build \
              -f user/Dockerfile \
              -t "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" \
              -t "$ECR_REGISTRY/$ECR_REPOSITORY:latest" \
              .

            docker push "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"
            docker push "$ECR_REGISTRY/$ECR_REPOSITORY:latest"
          fi

      - name: Install Session Manager Plugin
        shell: bash
        run: |
          set -euo pipefail

          curl -fsSL \
            "https://s3.amazonaws.com/session-manager-downloads/plugin/latest/ubuntu_64bit/session-manager-plugin.deb" \
            -o /tmp/session-manager-plugin.deb

          sudo dpkg -i /tmp/session-manager-plugin.deb

      - name: Generate temporary SSH key
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p ~/.ssh

          ssh-keygen \
            -t ed25519 \
            -N "" \
            -f ~/.ssh/marvelrun-temp

          chmod 600 ~/.ssh/marvelrun-temp

      - name: Configure SSH over Session Manager
        shell: bash
        run: |
          set -euo pipefail

          cat > ~/.ssh/config <<'EOF'
          Host i-* mi-*
              User ubuntu
              IdentityFile ~/.ssh/marvelrun-temp
              IdentitiesOnly yes
              ProxyCommand sh -c "aws ssm start-session --region ap-northeast-2 --target %h --document-name AWS-StartSSHSession --parameters 'portNumber=%p'"
              StrictHostKeyChecking accept-new
          EOF

          chmod 600 ~/.ssh/config

      - name: Create User API-KEY.yml from GitHub Secret
        env:
          API_KEY_YML: ${{ secrets.TEST_API_KEY_CONTENT }}
        shell: bash
        run: |
          set -euo pipefail

          if [ -z "${API_KEY_YML:-}" ]; then
            echo "::error::TEST_API_KEY_CONTENT Secret이 비어 있습니다."
            exit 1
          fi

          umask 077
          printf '%s\n' "$API_KEY_YML" > /tmp/user-API-KEY.yml

      - name: Register temporary SSH public key
        shell: bash
        run: |
          set -euo pipefail

          aws ec2-instance-connect send-ssh-public-key \
            --region "$AWS_REGION" \
            --instance-id "$EC2_INSTANCE_ID" \
            --instance-os-user ubuntu \
            --ssh-public-key file://$HOME/.ssh/marvelrun-temp.pub

      - name: Upload User API-KEY.yml to EC2
        shell: bash
        run: |
          set -euo pipefail

          scp \
            /tmp/user-API-KEY.yml \
            "${EC2_INSTANCE_ID}:/tmp/marvelrun-user-API-KEY.yml"

      - name: Deploy User backend with SSM Run Command
        id: deploy
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import json
          import os

          region = os.environ["AWS_REGION"]
          registry = os.environ["ECR_REGISTRY"]
          tag = os.environ["IMAGE_TAG"]

          commands = [
              "set -e",
              "mkdir -p /opt/marvelrun/secrets",
              "chmod 700 /opt/marvelrun/secrets",
              "install -o root -g root -m 600 "
              "/tmp/marvelrun-user-API-KEY.yml "
              "/opt/marvelrun/secrets/API-KEY.yml.new",
              "mv /opt/marvelrun/secrets/API-KEY.yml.new "
              "/opt/marvelrun/secrets/API-KEY.yml",
              "rm -f /tmp/marvelrun-user-API-KEY.yml",
              f"aws ecr get-login-password --region {region} "
              f"| docker login --username AWS --password-stdin {registry}",
              "cd /opt/marvelrun && "
              f"USER_BACKEND_IMAGE_TAG={tag} "
              "docker compose -f backend-compose.yml pull user-backend",
              "cd /opt/marvelrun && "
              f"USER_BACKEND_IMAGE_TAG={tag} "
              "docker compose -f backend-compose.yml "
              "up -d --no-deps --force-recreate user-backend",
              "sleep 5",
              "CONTAINER_ID=\"$(cd /opt/marvelrun && "
              f"USER_BACKEND_IMAGE_TAG={tag} "
              "docker compose -f backend-compose.yml ps -q user-backend)\"",
              'test -n "$CONTAINER_ID"',
              'test "$(docker inspect --format \'{{.State.Running}}\' "$CONTAINER_ID")" = "true"',
              f"docker logout {registry} || true",
              "docker image prune -f",
          ]

          with open("/tmp/ssm-parameters.json", "w", encoding="utf-8") as f:
              json.dump({"commands": commands}, f)
          PY

          COMMAND_ID=$(aws ssm send-command \
            --region "$AWS_REGION" \
            --instance-ids "$EC2_INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --parameters file:///tmp/ssm-parameters.json \
            --query 'Command.CommandId' \
            --output text)

          echo "command_id=$COMMAND_ID" >> "$GITHUB_OUTPUT"

      - name: Wait for deployment result
        shell: bash
        run: |
          set -euo pipefail

          aws ssm wait command-executed \
            --region "$AWS_REGION" \
            --command-id "${{ steps.deploy.outputs.command_id }}" \
            --instance-id "$EC2_INSTANCE_ID"

          aws ssm get-command-invocation \
            --region "$AWS_REGION" \
            --command-id "${{ steps.deploy.outputs.command_id }}" \
            --instance-id "$EC2_INSTANCE_ID" \
            --query '{Status:Status,StandardOutput:StandardOutputContent,StandardError:StandardErrorContent}'

      - name: Cleanup temporary files
        if: always()
        shell: bash
        run: |
          rm -f /tmp/user-API-KEY.yml
          rm -f /tmp/session-manager-plugin.deb
          rm -f /tmp/ssm-parameters.json
          rm -f ~/.ssh/marvelrun-temp
          rm -f ~/.ssh/marvelrun-temp.pub
