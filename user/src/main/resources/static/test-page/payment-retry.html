<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MARVEL RUN · payment-retry.html</title>

<body data-page="payment-retry"><main>
<div id="shell"></div>

<section><h2>1. 실패 주문 재준비</h2><div class="grid-3"><label>대상<select id="scope"><option value="personal">개인</option><option value="group">단체</option></select></label><label>paymentId<input id="paymentId"></label><div></div></div>
<div id="personalFields"><label>registrationId<input id="registrationId"></label></div><div id="groupFields" class="hidden"><label>organizationId<input id="organizationId"></label></div><code id="endpoint" class="endpoint"></code>
<div class="row-actions"><button id="format" class="secondary">JSON 정렬</button></div><label>본인확인 JSON<textarea id="body"></textarea></label><button id="send" data-api>주문 재준비</button><a id="goPay" class="button hidden" href="payment.html">재준비 주문 결제하기</a>
<div class="warn">CONFIRMING/UNKNOWN을 실패로 간주해 우회 결제하는 용도가 아닙니다. 서버가 재준비 가능 상태인지 검증합니다.</div></section>

<section><h2>실행 상태</h2><div id="status" class="status">요청 대기</div><details open><summary>최근 응답</summary><pre id="response">-</pre></details><details><summary>호출 기록 · 비밀번호/키 마스킹</summary><pre id="log">-</pre></details></section>

</main>
