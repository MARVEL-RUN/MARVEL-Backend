<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MARVEL RUN · group-lookup.html</title>
<link rel="stylesheet" href="assets/app.css">
</head>
<body data-page="group-lookup"><main>
<div id="shell"></div>

<section><h2>1. 단체 신청 확인</h2><code id="endpoint" class="endpoint"></code>
<div class="row-actions"><button id="useStored" class="secondary">최근 단체 인증값 불러오기</button><button id="format" class="secondary">JSON 정렬</button></div>
<label>단체 본인확인 JSON<textarea id="body" spellcheck="false"></textarea></label><button id="send" data-api>단체 신청 조회</button>
<h3>조회 항목</h3><div id="lookupRows" class="result-list"></div>
<p class="note">응답의 registrations는 현재 활성 구성원 전체입니다. 단체 수정은 이 전체 목록을 기준으로 작성하는 것이 안전합니다.</p></section>

<section><h2>실행 상태</h2><div id="status" class="status">요청 대기</div><details open><summary>최근 응답</summary><pre id="response">-</pre></details><details><summary>호출 기록 · 비밀번호/키 마스킹</summary><pre id="log">-</pre></details></section>

</main>
<script src="assets/common.js"></script>
<script src="assets/pages.js"></script>
</body></html>
